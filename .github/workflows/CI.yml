name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "22"
          check-latest: true
      - name: Install dependencies
        run: npm ci
      - name: Install Aiken
        uses: ./.github/actions/setup-aiken
      - name: Lint
        run: npm run lint
