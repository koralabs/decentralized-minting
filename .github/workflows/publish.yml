name: Publish npm package

on:
  push:
    branches:
      - master

jobs:
  publish:
    if: github.repository_owner == 'koralabs'
    name: Build & Publish
    environment: mainnet
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm CLI
        # npm's OIDC trusted-publisher flow requires npm >= 11.5.1, newer than
        # the npm bundled with Node 22. npm@latest tracks Node's supported
        # engines, so setup-node above resolves the latest Node 22 (check-latest).
        run: npm install -g npm@latest

      - name: Strip setup-node auth token placeholder
        # setup-node's `registry-url` writes `_authToken=${NODE_AUTH_TOKEN}`
        # into the managed .npmrc and exports NODE_AUTH_TOKEN as the literal
        # placeholder `XXXXX-XXXXX-XXXXX-XXXXX`. With trusted publishing
        # there must be NO bearer token on the request — otherwise npm
        # sends that placeholder and registry.npmjs.org 404s. Strip the
        # auth line and blank NODE_AUTH_TOKEN so npm falls through to the
        # OIDC token-exchange endpoint.
        run: |
          set -eu
          for f in "$HOME/.npmrc" "$NPM_CONFIG_USERCONFIG" "./.npmrc"; do
            if [[ -f "$f" ]]; then
              sed -i '/_authToken=/d' "$f"
            fi
          done
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"

      - name: Install Aiken
        uses: ./.github/actions/setup-aiken

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Aiken tests
        run: npm run test:aiken

      - name: Run Node tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Validate packed and workspace SDK types and runtime
        run: npm run validate:sdk-package

      - name: Publish to GitHub Packages
        env:
          DEPLOYMENT_ACCESS_TOKEN: ${{ secrets.DEPLOYMENT_ACCESS_TOKEN }}
        run: |
          set -eu
          npm config set //npm.pkg.github.com/:_authToken ${DEPLOYMENT_ACCESS_TOKEN}
          set +e
          publish_log=$(mktemp)
          (npm publish --@koralabs:registry='https://npm.pkg.github.com') >"${publish_log}" 2>&1
          status=$?
          set -e
          cat "${publish_log}"
          if [[ ${status} -ne 0 ]]; then
            # npm's wording for "already published" differs across versions:
            # npm 10 used "Cannot publish over existing version";
            # npm 11 uses "cannot publish over the previously published
            # versions" — match the common tail.
            if grep -qiE "publish over (the previously )?(existing|published) version" "${publish_log}"; then
              echo "GitHub package version already exists, continuing to public publish"
            else
              rm -f "${publish_log}"
              exit ${status}
            fi
          fi
          rm -f "${publish_log}"

      - name: Publish to public npm
        # OIDC trusted-publisher flow — no NPM_TOKEN. npm CLI >= 11.5.1
        # automatically exchanges the GitHub Actions OIDC token (via the
        # `id-token: write` permission set at the job level) for a short-
        # lived npm publish credential, and emits the provenance
        # attestation automatically.
        run: |
          set -eu
          set +e
          publish_log=$(mktemp)
          (npm publish --access public --ignore-scripts --provenance) >"${publish_log}" 2>&1
          status=$?
          set -e
          cat "${publish_log}"
          if [[ ${status} -ne 0 ]]; then
            # Treat "already published" as success so re-runs of an
            # unchanged version are idempotent.
            if grep -qiE "publish over (the previously )?(existing|published) version" "${publish_log}"; then
              echo "public npm version already exists, nothing to do"
            else
              rm -f "${publish_log}"
              exit ${status}
            fi
          fi
          rm -f "${publish_log}"
